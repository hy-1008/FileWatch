[package]
name = "filewatch-gui"
version = "0.1.3"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"
description = "FileWatch 图形界面：盘符选择 / 全量扫描 / Treemap 面积图 / 增量监控"

# ─────────────────────────────────────────────────────────────────────────────
# 独立的 workspace（它自己就是根）
#
# 引擎层（`crates/**`）坚持「零第三方依赖」，而 GUI 这一层必然要用 Tauri。
# 两者用 path 依赖相连：引擎不知道 GUI 的存在，GUI 只是引擎的一个调用方。
# 换句话说 —— **只有这一层被允许引入第三方库**，加依赖时请确认这一点。
# ─────────────────────────────────────────────────────────────────────────────
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`：关闭软件可以只藏到托盘（监控继续跑）。
# `image-ico`：让 Tauri 能读 `icons/icon.ico`（窗口图标与托盘图标共用这一份）。
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
# 系统通知（Windows 通知中心）。**只在 GUI 这一层**：引擎层仍然零依赖。
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

core-io = { path = "../../../crates/core-io" }
core-index = { path = "../../../crates/core-index" }
core-monitor = { path = "../../../crates/core-monitor" }
core-scan = { path = "../../../crates/core-scan" }
# 详情面板要显示 FRN：位布局由 `filename::make_frn` 定义，不能在这里自己移位
core-ntfs = { path = "../../../crates/core-ntfs" }
# 只为测试里构造引擎事件（PendingEvent 带 EventKind 字段）
core-usn = { path = "../../../crates/core-usn" }
core-viz = { path = "../../../crates/core-viz" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
